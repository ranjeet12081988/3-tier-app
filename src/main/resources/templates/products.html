<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .product-card { transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .stat-card { border-radius: 10px; padding: 20px; color: white; }
        .stat-card.primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .stat-card.success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/products">
                <i class="bi bi-box-seam"></i> Product Catalog
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/products">
                    <i class="bi bi-list"></i> Products
                </a>
                <a class="nav-link" href="/products/add">
                    <i class="bi bi-plus-circle"></i> Add Product
                </a>
                <a class="nav-link" href="/products/api" target="_blank">
                    <i class="bi bi-code-square"></i> API
                </a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Statistics -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="stat-card primary">
                    <h3 th:text="${statistics.totalProducts}">0</h3>
                    <p>Total Products</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card warning">
                    <h3 th:text="${statistics.lowStockProducts}">0</h3>
                    <p>Low Stock</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card success">
                    <h3 th:text="${statistics.totalInventoryValue}">$0</h3>
                    <p>Inventory Value</p>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/products}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="search" class="form-control" 
                               placeholder="Search products..." th:value="${search}">
                    </div>
                    <div class="col-md-3">
                        <select name="category" class="form-select">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${categories}" 
                                    th:value="${cat}" 
                                    th:text="${cat}"
                                    th:selected="${cat == category}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Search
                        </button>
                    </div>
                    <div class="col-md-2">
                        <a href="/products" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-x-circle"></i> Clear
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Products Table -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>SKU</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="product : ${products}">
                                <td th:text="${product.sku}">SKU</td>
                                <td>
                                    <strong th:text="${product.name}">Name</strong><br>
                                    <small class="text-muted" th:text="${product.description}">Description</small>
                                </td>
                                <td>
                                    <span class="badge bg-info" th:text="${product.category}">Category</span>
                                </td>
                                <td th:text="'$' + ${product.price}">$0.00</td>
                                <td>
                                    <span th:classappend="${product.quantity < 10} ? 'text-danger fw-bold' : ''"
                                          th:text="${product.quantity}">0</span>
                                </td>
                                <td>
                                    <span th:if="${product.quantity > 10}" class="badge bg-success">In Stock</span>
                                    <span th:if="${product.quantity <= 10}" class="badge bg-warning">Low Stock</span>
                                    <span th:if="${product.quantity == 0}" class="badge bg-danger">Out of Stock</span>
                                </td>
                                <td>
                                    <a th:href="@{/products/edit/{id}(id=${product.id})}" 
                                       class="btn btn-sm btn-primary" title="Edit">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <a th:href="@{/products/delete/{id}(id=${product.id})}" 
                                       class="btn btn-sm btn-danger" title="Delete"
                                       onclick="return confirm('Delete this product?')">
                                        <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(products)}">
                                <td colspan="7" class="text-center py-4">
                                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                                    <p>No products found</p>
                                    <a href="/products/add" class="btn btn-primary">Add Your First Product</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${currentPage - 1}, search=${search}, category=${category})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/products(page=${i}, search=${search}, category=${category})}" 
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/products(page=${currentPage + 1}, search=${search}, category=${category})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
