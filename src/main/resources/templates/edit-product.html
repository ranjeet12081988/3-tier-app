<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <header>
            <h1>✏️ Edit Product</h1>
        </header>
        
        <nav>
            <a th:href="@{/products}">📋 All Products</a>
            <a th:href="@{/products/add}">➕ Add Product</a>
        </nav>
        
        <div class="content">
            <form th:action="@{/products/edit/{id}(id=${product.id})}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">
                
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" th:field="*{name}" required>
                </div>
                
                <div class="form-group">
                    <label>Description</label>
                    <textarea th:field="*{description}"></textarea>
                </div>
                
                <div class="form-group">
                    <label>Price *</label>
                    <input type="number" th:field="*{price}" step="0.01" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Quantity *</label>
                    <input type="number" th:field="*{quantity}" min="0" required>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" th:field="*{category}">
                </div>
                
                <button type="submit" class="btn btn-success">💾 Update Product</button>
                <a th:href="@{/products}" class="btn btn-danger">Cancel</a>
            </form>
        </div>
    </div>
</body>
</html>
