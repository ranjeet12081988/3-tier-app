<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload CSV - Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/products">
                <i class="bi bi-box-seam"></i> Product Catalog
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/products"><i class="bi bi-list"></i> Products</a>
                <a class="nav-link" href="/products/add"><i class="bi bi-plus-circle"></i> Add Product</a>
                <a class="nav-link active" href="/products/upload"><i class="bi bi-upload"></i> Upload CSV</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0"><i class="bi bi-file-earmark-spreadsheet"></i> Upload Product CSV</h4>
                    </div>
                    <div class="card-body">
                        <!-- Success / Error Alerts -->
                        <div th:if="${message}" class="alert alert-success alert-dismissible fade show">
                            <span th:text="${message}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                            <span th:text="${error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <form method="POST" action="/products/upload" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="file" class="form-label fw-bold">Select CSV File</label>
                                <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
                                <div class="form-text">
                                    Required headers: <code>name, sku, price, quantity, category</code>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success">
                                    <i class="bi bi-cloud-arrow-up"></i> Upload and Import
                                </button>
                                <a href="/products" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
