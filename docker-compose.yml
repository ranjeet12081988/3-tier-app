version: '3.8'

services:
  # PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: product-catalog-db
    environment:
      POSTGRES_DB: product_catalog
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here # CHANGE THIS
    ports:
      - "5433:5432" # Maps host port 5433 to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_catalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Spring Boot Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-catalog-app
    depends_on:
      db:
        condition: service_healthy # Wait for the database to be ready
    environment:
      # Override your application.properties to connect to the 'db' service
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/product_catalog
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=your_password_here # Must match DB password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - app-network

# Define the shared network and volume
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: